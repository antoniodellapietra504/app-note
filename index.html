<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <!-- Schermata di Autenticazione Globale -->
    <div id="authScreen" class="auth-screen">
        <div class="glass small-modal text-center">
            <h1 class="auth-title">Pixel Notes</h1>
            <div class="lock-icon-large">🔒</div>
            <p id="authMessage">Protezione di sicurezza richiesta.</p>
            <button id="authBtn" class="btn-primary" style="width: 100%; margin-top: 20px;">Continua</button>
        </div>
    </div>

    <!-- App Principale (Nascosta finché non sbloccata) -->
    <div id="mainApp" class="app-container hidden">
        <header>
            <h1>Le mie Note</h1>
            <button id="addNoteBtn" class="fab">+</button>
        </header>

        <main id="notesList" class="notes-grid">
            <!-- Le note verranno inserite qui -->
        </main>

        <!-- Modale Editor Nota (Senza lucchetti) -->
        <div id="noteModal" class="modal hidden">
            <div class="modal-content glass">
                <input type="text" id="noteTitle" placeholder="Titolo della nota...">
                <textarea id="noteBody" placeholder="Scrivi qui la tua nota..."></textarea>
                <div class="modal-actions">
                    <div class="flex-spacer"></div>
                    <button id="closeModalBtn" class="btn-secondary">Chiudi</button>
                    <button id="saveNoteBtn" class="btn-primary">Salva</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
