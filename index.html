<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <div id="app">
        <header>
            <h1>Pixel Notes</h1>
            <button id="addNoteBtn" class="fab">+</button>
        </header>

        <main id="notesList" class="notes-grid">
            <!-- Notes will be injected here -->
        </main>

        <!-- Note Editor Modal -->
        <div id="noteModal" class="modal hidden">
            <div class="modal-content glass">
                <input type="text" id="noteTitle" placeholder="Titolo della nota...">
                <textarea id="noteBody" placeholder="Scrivi qui la tua nota..."></textarea>
                <div class="modal-actions">
                    <button id="lockBtn" class="icon-btn" title="Proteggi/Rimuovi password">🔓</button>
                    <div class="flex-spacer"></div>
                    <button id="closeModalBtn" class="btn-secondary">Chiudi</button>
                    <button id="saveNoteBtn" class="btn-primary">Salva</button>
                </div>
            </div>
        </div>

        <!-- Password Prompt Modal -->
        <div id="passwordModal" class="modal hidden">
            <div class="modal-content glass small-modal">
                <h2>Nota Protetta</h2>
                <p>Usa la tua impronta digitale o il viso per sbloccare questa nota.</p>
                <div class="modal-actions">
                    <button id="cancelPasswordBtn" class="btn-secondary">Annulla</button>
                    <button id="submitPasswordBtn" class="btn-primary">Sblocca con Biometria</button>
                </div>
            </div>
        </div>
        
        <!-- Set Password Modal -->
        <div id="setPasswordModal" class="modal hidden">
            <div class="modal-content glass small-modal">
                <h2>Protezione Biometrica</h2>
                <p>Vuoi proteggere questa nota usando la tua impronta digitale o il viso?</p>
                <div class="modal-actions">
                    <button id="removePasswordBtn" class="btn-danger hidden">Rimuovi Protezione</button>
                    <div class="flex-spacer"></div>
                    <button id="cancelSetPasswordBtn" class="btn-secondary">Annulla</button>
                    <button id="savePasswordBtn" class="btn-primary">Attiva Protezione</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
